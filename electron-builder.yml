appId: com.tiro.bilingual.workspace
productName: Tiro Live Bilingual Caption Workspace
npmRebuild: false
asar: true
asarUnpack:
  - node_modules/onnxruntime-web/dist/**/*
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
